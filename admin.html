<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ — LeAmourFlowers</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#101b43;--pink:#e9a2b6;--pink2:#f6dbe4;--cream:#faf7f3;--line:#e9e5e2;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:#f5f1f3;color:var(--navy);font-size:14px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit}

.lock{max-width:400px;margin:15vh auto;background:#fff;padding:44px 36px;box-shadow:0 20px 60px #7a43541a;text-align:center;border-radius:4px}
.lock h2{font:500 28px var(--serif);margin:0 0 12px}
.lock p{font-size:11px;color:#888;margin:0 0 24px}
.lock input{width:100%;padding:13px;border:1px solid #e9e4e5;background:#fdfbfa;margin-bottom:14px;font:inherit;outline:none;border-radius:2px}
.lock input:focus{border-color:var(--pink)}
.lock button{width:100%;padding:14px;background:var(--navy);color:#fff;border:0;font-weight:600;letter-spacing:.05em;border-radius:2px}
.lock button:hover{background:#1a2858}
.lock .error{color:#c44;font-size:11px;margin-top:12px;min-height:14px}

.admin{max-width:1240px;margin:0 auto;padding:32px 24px 60px}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:32px}
.head h1{font:500 32px var(--serif);margin:0}
.head .actions{display:flex;gap:10px;align-items:center}
.btn{padding:10px 16px;border:1px solid #e5dadd;background:#fff;color:var(--navy);font-size:11px;font-weight:600;letter-spacing:.05em;border-radius:2px;transition:.2s}
.btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat{background:#fff;padding:22px;border-radius:3px;box-shadow:0 8px 28px #7a43540d}
.stat small{display:block;font-size:10px;color:#9291a0;letter-spacing:.1em;margin-bottom:10px;font-weight:600}
.stat strong{font:500 30px var(--serif);color:var(--navy)}
.stat.pink strong{color:#c77996}
.stat.green strong{color:#1e6a3a}

.tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.tab{border:1px solid #e5dadd;background:#fff;padding:10px 16px;font-size:11px;color:var(--navy);border-radius:2px;font-weight:500;transition:.15s}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab:hover:not(.active){background:var(--pink2);border-color:var(--pink)}

.panel{background:#fff;padding:8px 24px 24px;border-radius:3px;box-shadow:0 8px 28px #7a43540d;overflow:hidden}
.panel-head{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-head h3{font:500 20px var(--serif);margin:0}
.panel-head small{font-size:10px;color:#9291a0}

.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{text-align:left;padding:14px 10px;border-bottom:1px solid #f0ece9;vertical-align:top}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9291a0;font-weight:600;background:#fafafb}
.tbl tr:hover td{background:#fdfbfa}
.tbl td.date{white-space:nowrap;font-size:11px;color:#6c6d80}
.tbl td.name{font-weight:600}
.tbl td.phone{white-space:nowrap;color:#6c6d80}
.tbl td.items{max-width:260px;font-size:11px;color:#6c6d80;line-height:1.5}
.tbl td.sum{font-weight:700;white-space:nowrap}
.tbl td.actions{white-space:nowrap}

.status-select{border:1px solid #e9e4e5;padding:6px 10px;font-size:11px;background:#fff;border-radius:2px;cursor:pointer;outline:none;font-family:inherit}
.status-select:focus{border-color:var(--pink)}

.empty{text-align:center;padding:70px 20px;color:#9291a0}
.empty .icon{font-size:44px;color:var(--pink);margin-bottom:12px}
.empty p{font-size:12px;margin:8px 0}

.del-btn{background:none;border:0;color:#c44;font-size:11px;text-decoration:underline;padding:4px 0}

@media (max-width:900px){
  .stats{grid-template-columns:1fr 1fr}
  .head h1{font-size:24px}
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none}
}
@media (max-width:640px){
  .stats{grid-template-columns:1fr}
  .tbl{font-size:11px}
  .tbl th:nth-child(3),.tbl td:nth-child(3){display:none}
  .admin{padding:20px 14px 40px}
  .panel{padding:6px 14px 18px}
}
</style>
</head>
<body>

<div id="lockScreen" class="lock">
  <h2>🌸 LeAmour Admin</h2>
  <p>Введите пароль для входа</p>
  <input type="password" id="adminPass" placeholder="Пароль" autofocus>
  <button onclick="tryLogin()">Войти</button>
  <div class="error" id="loginError"></div>
</div>

<div id="adminPanel" class="admin" style="display:none">
  <div class="head">
    <div>
      <h1>🌸 Панель управления</h1>
      <small style="color:#9291a0;font-size:11px;">LeAmourFlowers · <a href="index.html" style="text-decoration:underline">на сайт →</a></small>
    </div>
    <div class="actions">
      <button class="btn" onclick="exportData()">📥 Экспорт</button>
      <button class="btn" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><small>ВСЕГО ЗАКАЗОВ</small><strong id="statTotal">0</strong></div>
    <div class="stat pink"><small>НОВЫЕ</small><strong id="statNew">0</strong></div>
    <div class="stat"><small>В РАБОТЕ</small><strong id="statProgress">0</strong></div>
    <div class="stat green"><small>СУММА ₸</small><strong id="statSum">0</strong></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="all">Все заказы</button>
    <button class="tab" data-tab="new">Новые</button>
    <button class="tab" data-tab="progress">В работе</button>
    <button class="tab" data-tab="delivered">Доставлены</button>
    <button class="tab" data-tab="done">Завершены</button>
    <button class="tab" data-tab="cancel">Отменены</button>
    <button class="tab" data-tab="reviews">⭐ Отзывы</button>
  </div>

  <div class="panel" id="ordersPanel">
    <div class="panel-head">
      <h3>Заказы</h3>
      <small id="panelCount">0 записей</small>
    </div>
    <table class="tbl">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Клиент</th>
          <th>Телефон</th>
          <th>Заказ</th>
          <th>Сумма</th>
          <th>Доставка</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
    <div id="ordersEmpty" class="empty" style="display:none">
      <div class="icon">✿</div>
      <p>Заказов пока нет</p>
    </div>
  </div>

  <div class="panel" id="reviewsPanel" style="display:none">
    <div class="panel-head">
      <h3>Отзывы клиентов</h3>
      <small id="reviewsCount">0 записей</small>
    </div>
    <table class="tbl">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Имя</th>
          <th>Оценка</th>
          <th>Текст</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="reviewsBody"></tbody>
    </table>
    <div id="reviewsEmpty" class="empty" style="display:none">
      <div class="icon">💬</div>
      <p>Отзывов пока нет</p>
    </div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = 'leamour2024';   // ← поменяй на свой пароль

function tryLogin() {
  const val = document.getElementById('adminPass').value;
  if (val === ADMIN_PASSWORD) {
    sessionStorage.setItem('leamour_admin', '1');
    showPanel();
  } else {
    document.getElementById('loginError').textContent = 'Неверный пароль';
  }
}
function logout() {
  sessionStorage.removeItem('leamour_admin');
  location.reload();
}
document.getElementById('adminPass')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

function showPanel() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  renderAll();
}

function getOrders() {
  return JSON.parse(localStorage.getItem('leamour-orders') || '[]');
}
function saveOrders(o) {
  localStorage.setItem('leamour-orders', JSON.stringify(o));
}
function getReviews() {
  return JSON.parse(localStorage.getItem('leamour-reviews') || '[]');
}
function saveReviews(r) {
  localStorage.setItem('leamour-reviews', JSON.stringify(r));
}

const statusLabels = {
  new: 'Новый',
  progress: 'В работе',
  delivered: 'Доставлен',
  done: 'Завершён',
  cancel: 'Отменён'
};

let activeTab = 'all';

function renderOrders() {
  const orders = getOrders();
  const filtered = activeTab === 'all'
    ? orders
    : orders.filter(o => o.status === activeTab);

  const body = document.getElementById('ordersBody');
  const empty = document.getElementById('ordersEmpty');
  const count = document.getElementById('panelCount');

  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statNew').textContent = orders.filter(o => o.status === 'new').length;
  document.getElementById('statProgress').textContent = orders.filter(o => o.status === 'progress').length;
  document.getElementById('statSum').textContent =
    new Intl.NumberFormat('ru-RU').format(orders.reduce((s, o) => s + (o.total || 0), 0));

  count.textContent = filtered.length + ' записей';

  if (!filtered.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = filtered.map(o => `
    <tr>
      <td class="date">${new Date(o.createdAt).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
      })}</td>
      <td class="name">${escapeHtml(o.name)}</td>
      <td class="phone">${escapeHtml(o.phone)}</td>
      <td class="items">${escapeHtml(o.items || '—')}</td>
      <td class="sum">${new Intl.NumberFormat('ru-RU').format(o.total || 0)} ₸</td>
      <td class="date">${o.deliveryDate ? formatDateRu(o.deliveryDate) + (o.deliveryTime ? ' ' + o.deliveryTime : '') : '—'}</td>
      <td class="actions">
        <select class="status-select" data-id="${o.id}">
          ${Object.entries(statusLabels).map(([k, v]) =>
            `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`
          ).join('')}
        </select>
      </td>
    </tr>
  `).join('');

  body.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const orders = getOrders();
      const idx = orders.findIndex(o => o.id === sel.dataset.id);
      if (idx > -1) {
        orders[idx].status = sel.value;
        saveOrders(orders);
        renderOrders();
      }
    });
  });
}

function renderReviews() {
  const reviews = getReviews();
  const body = document.getElementById('reviewsBody');
  const empty = document.getElementById('reviewsEmpty');
  const count = document.getElementById('reviewsCount');

  count.textContent = reviews.length + ' записей';

  if (!reviews.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = reviews.map(r => `
    <tr>
      <td class="date">${new Date(r.createdAt).toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit'})}</td>
      <td class="name">${escapeHtml(r.name)}</td>
      <td>${'★'.repeat(r.stars || 5)}</td>
      <td class="items">${escapeHtml(r.text)}</td>
      <td class="actions">
        <button class="del-btn" data-del-review="${r.id}">Удалить</button>
      </td>
    </tr>
  `).join('');

  body.querySelectorAll('[data-del-review]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Удалить отзыв?')) return;
      const updated = getReviews().filter(r => r.id !== btn.dataset.delReview);
      saveReviews(updated);
      renderReviews();
    });
  });
}

function renderAll() {
  renderOrders();
  renderReviews();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;

    if (activeTab === 'reviews') {
      document.getElementById('ordersPanel').style.display = 'none';
      document.getElementById('reviewsPanel').style.display = 'block';
    } else {
      document.getElementById('ordersPanel').style.display = 'block';
      document.getElementById('reviewsPanel').style.display = 'none';
      renderOrders();
    }
  });
});

function exportData() {
  const data = {
    orders: getOrders(),
    reviews: getReviews(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `leamour-backup-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function formatDateRu(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

if (sessionStorage.getItem('leamour_admin') === '1') {
  showPanel();
}
</script>
</body>
</html>
